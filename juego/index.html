<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EC4217">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>El Espíritu y la misión · Ruta a la capilla</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Gochi+Hand&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Juego al aire libre: un solo tema claro a propósito, para leer bajo el sol. Lenguaje visual de cartel vial verde. */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --ink:#13201A; --muted:#4D5C54; --line:#CBD5CD;
  --sign:#0B6B45; --sign-dark:#08502F; --route:#16A36B;
  --warn:#F3B41C; --warn-ink:#2B1F00; --stop:#C33A2E; --off:#5C6963;
  --good-bg:#DDF1E6; --bad-bg:#FBE3E0;
  --f-display:"Overpass","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-weight:900;font-size:clamp(2rem,1.5rem + 2.5vw,2.8rem);letter-spacing:-.01em}
h2{font-weight:800;font-size:1.35rem}
h3{font-weight:800;font-size:1.05rem}
p{margin:0}
.kicker{font:700 12px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--sign)}
.kicker.light{color:#fff;opacity:.85}
.small{font-size:.88rem;color:var(--muted)}
.lead{font-size:1.08rem}
.center{text-align:center}
.page{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 36px) max(16px,env(safe-area-inset-left,0px))}
.page.wide{max-width:1100px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font:800 1rem/1 var(--f-display);padding:.95em 1.3em .9em;border-radius:999px;border:2px solid var(--ink);background:transparent;text-decoration:none;color:var(--ink);text-align:center}
.btn.primary{background:var(--sign);border-color:var(--sign);color:#fff}
.btn.danger{border-color:var(--stop);color:var(--stop)}
.btn.small{font-size:.86rem;padding:.65em 1em .6em}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.back{font:700 13px var(--f-mono);color:var(--sign);text-decoration:none;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.soft{background:transparent;border-style:dashed}
.notice{background:var(--warn);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-weight:700}
.stepn{font:700 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

/* Cartel vial (hero) */
.hero-sign{background:var(--sign);color:#fff;border:7px solid var(--sign);box-shadow:inset 0 0 0 3px #fff;border-radius:18px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:8px}
.hero-sign p:last-child{font:700 1.05rem/1.3 var(--f-display);opacity:.95}
.hero-arrow{width:44px;height:44px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;z-index:3000;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Equipo: preparación */
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 0;font:900 1.3rem/1 var(--f-display)}
.seg button[aria-pressed="true"]{background:var(--sign);border-color:var(--sign);color:#fff}
label.lbl{font:700 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.input{width:100%;font:700 1.05rem var(--f-body);padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rules li{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center}
.rules b{font:900 1.05rem var(--f-display);text-align:center;border-radius:8px;padding:6px 0 4px}
.rules .p{background:var(--good-bg);color:var(--sign-dark)} .rules .n{background:var(--bad-bg);color:#8E2219}

/* Equipo: recorrido */
.tv{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg)}
.nav{background:var(--sign);color:#fff;display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;z-index:500;transition:background-color .3s,color .3s;box-shadow:0 6px 18px -10px rgba(0,0,0,.55);
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.nav[data-tone="warn"]{background:var(--warn);color:var(--warn-ink)}
.nav[data-tone="stop"]{background:var(--stop)}
.nav[data-tone="off"]{background:var(--off)}
.nav-ico{width:64px;height:64px;display:grid;place-items:center}
.nav-ico svg{width:56px;height:56px;transition:transform .45s ease}
.nav-ico svg.spinning{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nav-dist{font:900 2.2rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.nav-text{font:700 1.02rem/1.25 var(--f-display);margin-top:3px}
.nav-chip{display:inline-block;font:700 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;background:rgba(255,255,255,.2);padding:5px 8px 4px;border-radius:5px;margin-top:7px}
.nav[data-tone="warn"] .nav-chip{background:rgba(0,0,0,.1)}
.tv-map{position:relative;min-height:0;background:#DCE3DA}
#tmap{position:absolute;inset:0}
.map-off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-weight:700}
.sim{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:600;background:var(--ink);color:#fff;font:700 11px var(--f-mono);padding:7px 11px;border-radius:999px;letter-spacing:.05em;white-space:nowrap}
.bar{background:var(--surface);border-top:1px solid var(--line);z-index:500;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px 12px;align-items:center;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px))}
.stat span{display:block;font:700 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat strong{font:800 1.4rem/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.icon-btn{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.bar-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:10px}
.scan-btn{font-size:1.1rem;padding:1em 1.2em .95em}

/* Pantalla grande (un jugador, la clase mira) */
.side{display:none}
.live-badge{position:absolute;top:10px;left:10px;z-index:600;background:var(--stop);color:#fff;font:700 12px/1 var(--f-mono);letter-spacing:.1em;padding:7px 11px 6px;border-radius:999px;display:flex;gap:7px;align-items:center}
.live-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.tv.pantalla .sim{top:auto;bottom:10px}
.tv.pantalla .nav{grid-template-columns:84px minmax(0,1fr)}
.tv.pantalla .nav-ico{width:84px;height:84px}
.tv.pantalla .nav-ico svg{width:76px;height:76px}
.tv.pantalla .nav-dist{font-size:3.1rem}
.tv.pantalla .nav-text{font-size:1.3rem}
.tv.pantalla .stat strong{font-size:1.7rem}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.legend li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;font:700 1rem/1.2 var(--f-display)}
.legend svg{width:26px;height:32px;justify-self:center}
.legend .me{width:18px;height:18px;border-radius:50%;background:#1F6FEB;border:3px solid #fff;box-shadow:0 0 0 1px #1F6FEB;justify-self:center}
.legend .trail{width:30px;height:6px;border-radius:3px;background:#0B6B45;justify-self:center}
.class-q{background:var(--warn);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font:800 1.05rem/1.3 var(--f-display)}
.sheet.big .cartel-quote{font-size:1.5rem}
.sheet.big .opt{font-size:1.15rem;padding:16px 18px}
.sheet.big h2{font-size:1.7rem}
.final-map{height:280px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#DCE3DA}
@media (orientation:landscape) and (min-width:700px){
  .tv{grid-template-columns:minmax(0,1fr) minmax(300px,34%);grid-template-rows:auto 1fr auto}
  .tv .nav{grid-column:2;grid-row:1}
  .tv .tv-map{grid-column:1;grid-row:1 / span 3}
  .tv .side{display:flex;flex-direction:column;gap:14px;grid-column:2;grid-row:2;background:var(--surface);border-left:1px solid var(--line);padding:18px 20px;overflow:auto;min-height:0}
  .tv .bar{grid-column:2;grid-row:3;border-left:1px solid var(--line)}
  .sheet-wrap{align-items:center}
  .sheet{border-radius:22px}
}

/* Pantalla del proyector */
.tv.screen .nav{grid-template-columns:96px minmax(0,1fr)}
.tv.screen .nav-ico{width:96px;height:96px}
.tv.screen .nav-ico svg{width:86px;height:86px}
.tv.screen .nav-dist{font-size:3.6rem}
.tv.screen .nav-text{font-size:1.4rem}
.tv.screen .side h2{font-size:1.6rem}
.scr-wait{position:absolute;inset:0;z-index:650;background:rgba(238,242,236,.82);display:grid;place-items:center;padding:24px}
.scr-wait .card{max-width:520px;text-align:center}
.scr-over{position:fixed;inset:0;z-index:1500;background:rgba(10,20,15,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.scr-over .sheet{animation:up .35s ease;max-height:92vh;border-radius:22px}
.scr-over .sheet-head{border-radius:22px 22px 0 0}
.stats3.mini strong{font-size:1.6rem}
.stats3.mini div{padding:10px 6px}
@media (orientation:landscape) and (min-width:700px){ .tv.screen .side{grid-row:2 / span 2} }
@media (orientation:portrait){ .tv.screen{grid-template-rows:auto 1fr} }

/* Modo líder: extras */
.range{display:grid;gap:6px}
.range span{display:flex;justify-content:space-between;font-weight:700}
.range input{width:100%;accent-color:var(--sign)}
.gpsline.field{flex-wrap:wrap;font-weight:500;line-height:1.5}
.gpsline .ok{color:var(--sign)} .gpsline .bad{color:var(--stop)}
.check{margin:0;padding-left:1.2em;display:grid;gap:6px}
.check a{color:var(--sign);font-weight:700}
.links{display:grid;gap:12px}
.linkrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;border-top:1px solid var(--line);padding-top:12px}
.linkrow .linkbox{margin-top:6px}
@media (max-width:480px){ .linkrow{grid-template-columns:1fr} }
details.more{border-top:1px dashed var(--line);padding-top:12px}
details.more summary{cursor:pointer;font-weight:700;color:var(--muted)}
details.more[open]{display:grid;gap:10px}
.card.next{border-color:var(--sign)}
.card.next .verse{font-style:italic;font-size:1.1rem}
.card.safety{background:var(--good-bg);border-color:transparent}

/* Hojas */
.sheet-wrap{position:fixed;inset:0;z-index:1500;background:rgba(10,20,15,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:94%;overflow:auto;animation:up .3s ease;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-head{padding:20px 20px 18px;background:var(--sign);color:#fff;border-radius:22px 22px 0 0;display:grid;gap:6px}
.sheet-head.stop{background:var(--stop)} .sheet-head.warn{background:var(--warn);color:var(--warn-ink)} .sheet-head.off{background:var(--off)}
.sh-k{font:700 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;opacity:.9;display:flex;align-items:center;gap:8px}
.sh-k svg{width:18px;height:18px}
.sheet-body{padding:18px 20px 4px;display:flex;flex-direction:column;gap:14px}
.cartel-quote{background:var(--sign);color:#fff;border:5px solid var(--sign);box-shadow:inset 0 0 0 2px #fff;border-radius:12px;padding:14px 16px;font:800 1.2rem/1.25 var(--f-display)}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font:700 1rem/1.3 var(--f-display)}
.opt.ok{border-color:var(--route);background:var(--good-bg)}
.opt.no{border-color:var(--stop);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.pts{font:900 2.6rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.pts.good{color:var(--sign)} .pts.bad{color:var(--stop)}
.ref{font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--sign)}
.feedback{display:grid;gap:8px}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:52vh;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam-frame{position:absolute;inset:18%;border:4px solid #fff;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.codein{width:100%;font:900 2.4rem/1 var(--f-mono);letter-spacing:.35em;text-align:center;text-transform:uppercase;padding:14px 10px;border:3px solid var(--sign);border-radius:14px;color:var(--ink);background:var(--surface)}
.menu{display:grid;gap:10px}
.countdown{font:900 3.4rem/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--stop)}

/* Marcadores */
.mk{position:relative;width:32px;height:40px}
.mk svg{width:32px;height:40px;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.mk-label{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);white-space:nowrap;background:#fff;border:1px solid var(--line);font:800 11.5px/1 var(--f-display);padding:4px 7px 3px;border-radius:6px;color:var(--ink)}
.mk.target svg{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

/* Final */
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats3 div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.stats3 strong{display:block;font:900 2rem/1 var(--f-display)}
.stats3 span{font-size:.82rem;color:var(--muted);line-height:1.2;display:block;margin-top:6px}

/* Líder */
.gpsline{font:700 13px var(--f-mono);padding:10px 12px;border-radius:10px;background:var(--bg);display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--off);flex:none}
.dot.ok{background:var(--route)} .dot.mid{background:var(--warn)} .dot.bad{background:var(--stop)}
.lmap{height:320px;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative;background:#DCE3DA}
.summary{font:700 13px var(--f-mono);color:var(--muted)}
.grp{margin-top:8px;font:700 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.prow{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:10px}
.prow.off .prow-info{opacity:.5}
.prow-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.prow-name{font:800 1.05rem/1.2 var(--f-display);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prow-sign{font-size:.93rem;color:var(--muted);margin-top:3px}
.code{font:700 12px var(--f-mono);letter-spacing:.12em;border:1px solid var(--line);border-radius:5px;padding:3px 6px 2px}
.tag{font:700 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;padding:4px 7px 3px;border-radius:4px}
.tag.good{background:var(--good-bg);color:var(--sign-dark)} .tag.trap{background:var(--bad-bg);color:#8E2219} .tag.dest{background:var(--warn);color:var(--warn-ink)}
.status{font:700 12px var(--f-mono);color:var(--muted);margin-top:5px}
.status.ok{color:var(--sign)}
.prow-act{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:none;margin-top:2px}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;pointer-events:none}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked + span{background:var(--sign)}
.sw input:checked + span::after{transform:translateX(18px)}
.sw input:disabled{cursor:default}
.qrbox{background:#fff;padding:14px;border-radius:14px;border:1px solid var(--line);align-self:center;width:min(300px,100%)}
.qrbox img,.qrbox canvas{width:100%!important;height:auto!important;display:block}
.linkbox{width:100%;font:500 12px var(--f-mono);padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--muted)}
.bigqr{position:fixed;inset:0;z-index:2500;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.bigqr .qrbox{width:min(86vw,72vh);border:0}

/* Carteles */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.carteles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cartel{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.c-top{font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.cartel .board{width:100%;background:var(--sign);color:#fff;border:7px solid var(--sign);box-shadow:inset 0 0 0 3px #fff;border-radius:14px;padding:20px 16px;font:900 1.5rem/1.15 var(--f-display);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cartel .qr{width:190px}
.cartel .qr img,.cartel .qr canvas{width:100%!important;height:auto!important;display:block}
.cartel .code-big{font:900 1.9rem/1 var(--f-mono);letter-spacing:.25em}
.c-foot{font-size:.85rem;color:var(--muted)}

@media (max-width:420px){ .seg{grid-template-columns:repeat(3,1fr)} .nav-dist{font-size:1.9rem} }
@media (prefers-reduced-motion: reduce){ .mk.target svg,.sheet{animation:none} .nav-ico svg{transition:none} }
@media print{
  .noprint{display:none!important}
  body{background:#fff}
  .page{max-width:none;padding:0;gap:0}
  .carteles{display:block}
  .cartel{height:132mm;margin:0 0 5mm;border:1px dashed #999;break-inside:avoid;page-break-inside:avoid;justify-content:center}
  .cartel .board{font-size:26pt}
  .cartel .qr{width:60mm}
  @page{size:A4;margin:10mm}
}

/* ===== Tema GO (afiche «El Espíritu y la misión»): rojo, crema y azul marino; Anton + Space Mono + Gochi Hand ===== */
:root{
  --bg:#EC4217; --surface:#FBF4E9; --ink:#1B2266; --muted:#5D6190; --line:#E4D6C1;
  --sign:#2536A8; --sign-dark:#17237A; --route:#2536A8;
  --warn:#FFB321; --warn-ink:#2A1A00; --stop:#E5320B; --off:#5D6190;
  --good-bg:#E1E5FB; --bad-bg:#FDE1D7;
  --navy:#2536A8; --red:#EC4217; --cream:#FBF4E9;
  --f-display:"Anton","Impact","Arial Narrow",sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Space Mono",ui-monospace,Menlo,monospace;
  --f-hand:"Gochi Hand","Comic Sans MS",cursive;
}
body{background:var(--red);color:#fff}
.card,.sheet,.tv,.toast,.bigqr,.stats3 div,.cartel{color:var(--ink)}
h1,h2,h3{font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1.02}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
.kicker{color:var(--cream);font-weight:700}
.card .kicker,.sheet .kicker,.side .kicker,.tv .kicker{color:var(--navy)}
.page > .small,.page > p.small{color:var(--cream);opacity:.9}
.back{color:var(--cream)}
.lead{font-size:1.1rem;line-height:1.5}
label.lbl{color:var(--cream)}
.card label.lbl{color:var(--muted)}
.btn{font:400 1.05rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.05em;border-radius:10px;border:2.5px solid var(--navy);color:var(--navy);background:var(--cream);box-shadow:4px 4px 0 var(--navy);padding:.85em 1.2em .8em;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:4px 4px 0 #0E1550}
.btn.danger{color:var(--stop);border-color:var(--stop);box-shadow:4px 4px 0 var(--stop);background:var(--cream)}
.btn.small{font-size:.9rem;padding:.65em .95em .6em;box-shadow:3px 3px 0 var(--navy)}
.btn.primary.small{box-shadow:3px 3px 0 #0E1550}
.card{border:0;border-radius:6px;box-shadow:7px 7px 0 rgba(23,30,90,.28);padding:20px}
.card.soft{background:transparent;color:#fff;border:2px dashed rgba(251,244,233,.7);box-shadow:none}
.card.soft h3{color:#fff}
.card .card.soft,.sheet .card.soft{color:var(--ink);border-color:var(--line)}
.card .card.soft h3{color:var(--ink)}
.notice{background:var(--cream);color:var(--stop);box-shadow:4px 4px 0 var(--navy);border-radius:6px}
.stepn{color:var(--stop);font-weight:700}
.input{border:2.5px solid var(--navy);border-radius:8px;font-family:var(--f-body);font-weight:500}
.seg button{border:2.5px solid var(--navy);background:var(--cream);color:var(--navy);border-radius:8px;font:400 1.5rem/1 var(--f-display);box-shadow:3px 3px 0 var(--navy)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.rules b{font:400 1.15rem var(--f-display);border-radius:4px}
.rules .p{background:var(--cream);color:var(--navy)} .rules .n{background:var(--navy);color:#fff}
.card.safety{background:var(--cream)}
.card.next{box-shadow:7px 7px 0 var(--navy)}
.card.next h2{color:var(--stop)}
.card.next .verse{font-family:var(--f-hand);font-style:normal;font-size:1.4rem;color:var(--navy)}
.ref{font-family:var(--f-mono);color:var(--stop)}
.gpsline{background:#F3E9D9;color:var(--ink);border-radius:6px}
.summary,.grp{color:var(--muted)}
.tag{border-radius:3px}
.tag.good{background:var(--good-bg);color:var(--navy)} .tag.dest{background:var(--navy);color:#fff} .tag.trap{background:var(--bad-bg);color:var(--stop)}
.code{border-color:var(--navy);color:var(--navy)}
.sw input:checked + span{background:var(--navy)}
.status.ok{color:var(--navy)}
.lmap{border:2.5px solid var(--navy);border-radius:6px}
.linkbox{background:#F3E9D9;border-color:var(--line)}
details.more summary{color:var(--navy)}
.toast{background:var(--navy);box-shadow:4px 4px 0 rgba(0,0,0,.25)}

/* Encabezado tipo afiche */
.poster{position:relative;display:grid;gap:10px;padding:10px 0 6px;color:#fff;isolation:isolate}
.poster .serie{font:700 12.5px/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--cream)}
.poster h1{color:#fff;font-size:clamp(3.1rem,2rem + 6.5vw,5.6rem);line-height:.9;max-width:8.5ch}
.poster .ref-hand{font:400 clamp(1.7rem,1.3rem + 1.4vw,2.3rem)/1 var(--f-hand);color:#fff;margin-top:2px;text-transform:uppercase}
.poster-note{font:700 12px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--cream)}
.sticker{position:relative;justify-self:start;background:var(--cream);color:var(--red);font:400 1.35rem/1.1 var(--f-hand);padding:10px 16px 8px;transform:rotate(-2deg);box-shadow:5px 5px 0 rgba(23,30,90,.25);margin-top:8px}
.tape::before{content:"";position:absolute;top:-13px;left:50%;width:96px;height:24px;transform:translateX(-50%) rotate(-5deg);background-color:var(--navy);
  background-image:linear-gradient(rgba(255,255,255,.35) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.35) 1.5px,transparent 1.5px);background-size:8px 8px;opacity:.95}
.tape.dots::before{background-image:radial-gradient(rgba(255,255,255,.55) 2.2px,transparent 2.6px);background-size:10px 10px}
.doodle{position:absolute;color:var(--navy);pointer-events:none;z-index:-1}
.doodle svg{width:100%;height:100%;display:block}
.d-star{width:92px;height:92px;right:-6px;top:-8px}
.d-spiral{width:64px;height:64px;right:22%;top:44%}
.go-badge{display:inline-block;font:400 2.1rem/1 var(--f-display);color:#fff;transform:skewX(-10deg);letter-spacing:.01em;text-shadow:3px 3px 0 var(--navy)}
.hero-sign{background:var(--navy);border:0;box-shadow:7px 7px 0 rgba(23,30,90,.3);border-radius:6px;padding:22px 20px}
.hero-sign h1{color:#fff}
.hero-sign p:last-child{font-family:var(--f-hand);font-weight:400;font-size:1.4rem}

/* Juego: banda GPS, plano y panel */
.tv{background:var(--cream)}
.nav{background:var(--navy);box-shadow:0 5px 0 rgba(23,30,90,.25)}
.nav[data-tone="stop"]{background:var(--stop)}
.nav-dist{font:400 2.5rem/1 var(--f-display);letter-spacing:.02em}
.nav-text{font:700 1.05rem/1.25 var(--f-body)}
.nav-chip{font-family:var(--f-mono);border-radius:3px}
.tv.pantalla .nav-dist{font-size:3.3rem} .tv.screen .nav-dist{font-size:3.9rem}
.tv.pantalla .nav-text,.tv.screen .nav-text{font-size:1.35rem}
.tv-map{background:var(--cream)}
.bar{background:var(--cream);border-top:3px solid var(--navy)}
.stat strong{font:400 1.6rem/1.1 var(--f-display)}
.icon-btn{border:2.5px solid var(--navy);color:var(--navy);background:var(--cream)}
.side{background:var(--cream)!important;border-left:3px solid var(--navy)!important}
.side-title{font:400 2.1rem/.95 var(--f-display);text-transform:uppercase;color:var(--red)}
.side-ref{font:400 1.4rem/1 var(--f-hand);color:var(--navy);text-transform:uppercase}
.live-badge{background:var(--red);font-family:var(--f-mono);border-radius:3px;box-shadow:3px 3px 0 var(--navy)}
.sim{background:var(--navy);font-family:var(--f-mono);border-radius:3px}
.legend li{font:700 1rem/1.2 var(--f-body)}
.legend svg{width:30px;height:30px}
.scr-wait{position:absolute;inset:auto 0 0 0;z-index:650;background:transparent;display:flex;justify-content:center;padding:24px;pointer-events:none}
.scr-wait[hidden]{display:none!important}
.scr-wait .card{box-shadow:7px 7px 0 var(--navy)}
.iconpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.ic{position:relative;display:grid;justify-items:center;gap:4px;padding:8px 4px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);cursor:pointer;font-size:.72rem;font-weight:700}
.ic input{position:absolute;opacity:0;pointer-events:none}
.ic:has(input:checked){border-color:var(--navy);background:var(--good-bg)}
.ic:has(input:focus-visible){outline:3px solid var(--warn)}
.prow-ic{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;background:var(--navy);color:#fff}
.prow-ic.trap{background:var(--stop)} .prow-ic.dest{background:var(--red)}
.sheet{border-radius:10px 10px 0 0;background:var(--cream)}
.sheet-head{background:var(--navy);border-radius:10px 10px 0 0}
.sheet-head h2{font-size:1.6rem}
.sheet.big h2{font-size:2rem}
.scr-over .sheet,.scr-over .sheet-head{border-radius:10px}
.scr-over .sheet-head{border-radius:10px 10px 0 0}
.cartel-quote{background:var(--red);border:6px solid var(--red);box-shadow:inset 0 0 0 2.5px var(--cream);border-radius:6px;font:400 1.35rem/1.12 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.sheet.big .cartel-quote{font-size:1.8rem}
.opt{background:#fff;border:2.5px solid var(--line);border-radius:8px;font:700 1rem/1.3 var(--f-body)}
.opt.ok{border-color:var(--navy);background:var(--good-bg)}
.pts{font:400 2.8rem/1 var(--f-display)}
.class-q{background:var(--navy);color:#fff;font:400 1.35rem/1.15 var(--f-hand);border-radius:6px}
.stats3 div{border:0;border-radius:6px;box-shadow:5px 5px 0 rgba(23,30,90,.25)}
.stats3 strong{font:400 2.3rem/1 var(--f-display);color:var(--red)}
.final-map{position:relative;overflow:hidden;height:300px;border:2.5px solid var(--navy);border-radius:6px;background:var(--cream)}
.plano{display:block;width:100%;height:100%;touch-action:manipulation}
.plano text{font-family:var(--f-mono)}
.plano .hand{font-family:var(--f-hand)}
.plano .pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion: reduce){ .plano .pulse{animation:none;opacity:.35} }

.pause-over{position:absolute;inset:0;z-index:640;background:rgba(27,34,102,.55);display:grid;place-items:center;padding:24px}
.pause-over .card{max-width:420px;text-align:center}
.editor{display:grid;gap:8px;background:#F3E9D9;border-radius:6px;padding:14px}
.fieldtest{display:grid;gap:10px;border-top:2px dashed var(--line);padding-top:14px}
.ftout{display:grid;gap:8px}
.ftout:empty{display:none}
.warnline{background:var(--bad-bg);color:var(--stop);border-radius:6px;padding:10px 12px;font-weight:700}
.editor textarea{resize:vertical;min-height:72px}
.optrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.optrow input[type=radio]{width:22px;height:22px;accent-color:var(--navy)}
.tag.new{background:var(--red);color:#fff}

/* ===== Escena 3D (modo interior) ===== */
.scene{--u:1;position:absolute;inset:0;overflow:hidden;perspective:900px;perspective-origin:50% 26%;background:radial-gradient(ellipse at 50% 12%,#a18a68 0%,#514439 42%,#292725 100%);user-select:none;-webkit-user-select:none}
.scene.big{--u:1.45}
.scene .sky{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 28% 0%,rgba(255,226,173,.34),transparent 48%),radial-gradient(ellipse at 75% 0%,rgba(255,226,173,.22),transparent 45%),repeating-linear-gradient(90deg,transparent 0 19%,rgba(20,16,12,.12) 19% 20%);box-shadow:inset 0 24px 70px rgba(0,0,0,.4)}
.scene .sc-cam{position:absolute;left:50%;top:60%;width:0;height:0;overflow:visible;transform-style:preserve-3d;transition:transform .55s ease-out}
.scene .floor{position:absolute;left:0;top:0;transform-style:preserve-3d;border-radius:3px;background-color:#b78a58;
  background-image:repeating-linear-gradient(91deg,rgba(63,34,16,.09) 0 1px,transparent 1px 5px,rgba(255,230,183,.12) 5px 6px,transparent 6px 13px),linear-gradient(90deg,rgba(57,31,14,.38) 1px,rgba(255,234,192,.32) 2px,transparent 3px),linear-gradient(90deg,transparent 48%,rgba(76,43,22,.24) 49%,rgba(255,236,196,.18) 50%,transparent 51%),linear-gradient(0deg,rgba(60,34,18,.22) 1px,transparent 2px);
  box-shadow:inset 0 0 65px rgba(64,36,17,.25),0 0 0 5px #6e4b2f,0 0 0 9px #39291f,0 35px 65px rgba(0,0,0,.45)}
.scene .floor-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.scene .floor-pulse{animation:fpulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fpulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
.scene .walls,.scene .things{position:absolute;inset:0;transform-style:preserve-3d}
.scene .wall{position:absolute;top:0;background:repeating-linear-gradient(12deg,rgba(90,65,40,.05) 0 1px,transparent 1px 4px),linear-gradient(#baa78a,#f0e3cb 55%,#dac5a5);border-top:3px solid #6b4930;box-shadow:inset 0 3px 5px rgba(42,26,13,.3),inset 0 -2px 2px rgba(255,247,220,.65)}
.scene .wall.front{left:0;transform-origin:0 0;transform:rotateX(90deg)}
.scene .wall.side{transform-origin:0 0;transform:rotateY(-90deg)}
.scene .th,.scene .hero{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.scene .hero{transition:transform .55s ease-out}
.scene .bb{position:absolute;left:-60px;bottom:0;width:120px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%;transition:transform .55s ease-out;pointer-events:none}
.scene .board{position:relative;width:calc(48px*var(--u));height:calc(42px*var(--u));border-radius:3px;display:grid;place-items:center;background:linear-gradient(135deg,#fff9ed,#e7d6b9);color:#2536A8;border:3px solid #80603c;box-shadow:inset 0 1px 1px #fff8e8,2px 2px 0 #53391f,3px 4px 0 #49331f,5px 8px 9px rgba(42,27,13,.3)}
.scene .board .ico{display:grid;place-items:center;width:70%;height:70%;z-index:1}
.scene .board .ico svg{width:100%;height:100%}
.scene .post{position:relative;width:calc(7px*var(--u));height:calc(28px*var(--u));background:linear-gradient(90deg,#543820,#c3935e 40%,#86603a 70%,#4e3521);border-radius:0 0 2px 2px;box-shadow:2px 0 2px rgba(38,24,12,.25)}
.scene .lbl{font:700 calc(15px*var(--u))/1.15 var(--f-body);color:#FBF4E9;background:linear-gradient(120deg,#3449ba,#2536A8);padding:4px 9px;border:1px solid rgba(251,244,233,.5);border-radius:3px;margin-bottom:5px;white-space:nowrap;box-shadow:0 2px 0 #19256c,2px 4px 6px rgba(31,22,14,.3)}
.scene .k-target .board{background:linear-gradient(135deg,#4358c8,#2536A8);color:#fff;border-color:#e1c69b}
.scene .k-visited .board{background:linear-gradient(135deg,#8992ae,#596580);color:#fff;border-color:#cbb28c}
.scene .k-unknown .board{border-style:solid;transform:rotate(-5deg)}
.scene .k-trap .board{background:linear-gradient(135deg,#fff9ed,#e7d6b9);color:#fff}
.scene .k-trap .burst{position:absolute;inset:4%;width:92%;height:92%;filter:drop-shadow(0 1px 1px rgba(70,20,5,.3))}
.scene .k-trap .lbl,.scene .k-dest .lbl{background:linear-gradient(120deg,#f35b30,#EC4217)}
.scene .k-dest .board{width:calc(56px*var(--u));height:calc(50px*var(--u));background:linear-gradient(135deg,#fa7044,#EC4217);color:#fff;border-color:#e1c69b}
.scene .badge{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;background:#2536A8;color:#fff;font:700 12px/20px var(--f-body);text-align:center;border:2px solid #fff}
.scene .beam{position:absolute;bottom:calc(30px*var(--u));left:50%;width:calc(34px*var(--u));height:calc(260px*var(--u));transform:translateX(-50%);background:linear-gradient(to top,rgba(255,255,255,.85),rgba(255,255,255,0));filter:blur(3px);border-radius:40%;z-index:-1}
.scene .bob{font:700 calc(22px*var(--u))/1 var(--f-body);color:#FFB321;text-shadow:0 2px 0 #141D6B;animation:bob 1s ease-in-out infinite;margin-bottom:2px}
.scene .hero-bb{left:-50px;width:100px}
.scene .hero-fig{width:calc(58px*var(--u));transition:transform .2s}
.scene .hero-fig svg{width:100%;height:auto;display:block;filter:drop-shadow(2px 3px 2px rgba(45,29,16,.28))}
.scene .hero-name{font:700 calc(15px*var(--u))/1.15 var(--f-body);color:#fff;background:#EC4217;padding:4px 9px;border:1px solid #ffc1a9;border-radius:3px;margin-bottom:6px;white-space:nowrap;box-shadow:0 2px 0 #9b3016,2px 4px 6px rgba(31,22,14,.3)}
.scene .walking svg{animation:walkbob .36s ease-in-out infinite}
.scene .walking .leg.l{animation:legl .36s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
.scene .walking .leg.r{animation:legl .36s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}
.scene .walking .arm.f{animation:legl .36s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}
@keyframes walkbob{50%{transform:translateY(-3px)}}
@keyframes legl{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.scene-n{position:absolute;top:12px;right:14px;display:grid;justify-items:center;gap:2px;color:#FBF4E9;font:700 10px/1 var(--f-mono);letter-spacing:.1em;transition:transform .55s ease-out;z-index:2}
.scene-n svg{width:16px;height:24px}
.tv.pantalla .sim,.tv .sim{z-index:700}
.dpad{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;z-index:660;display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad[hidden]{display:none}
.dpad button{width:58px;height:58px;border-radius:12px;border:3px solid #2536A8;background:rgba(251,244,233,.92);color:#2536A8;display:grid;place-items:center;box-shadow:3px 3px 0 rgba(14,21,80,.45);touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
.dpad button svg{width:30px;height:30px;pointer-events:none}
.dpad button.on{background:#EC4217;color:#fff;border-color:#EC4217;transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(14,21,80,.45)}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.dpad .mid{grid-column:2;grid-row:2;border-radius:50%;width:22px;height:22px;place-self:center;background:rgba(37,54,168,.55);pointer-events:none}
.rotate-hint{display:none}
@media (orientation:portrait) and (max-width:600px){
  .tv.girar .rotate-hint{display:flex;position:fixed;inset:0;z-index:1400;background:#1B2266;color:#FBF4E9;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center}
  .rotate-hint svg{width:96px;height:96px;animation:girar 2.2s ease-in-out infinite}
  .rotate-hint h2{font:900 1.9rem/1.05 var(--f-display);text-transform:uppercase;margin:0;color:#FBF4E9}
  .rotate-hint p{margin:0;max-width:300px;font-weight:600}
  .rotate-hint button{background:transparent;color:#FBF4E9;border:2px solid rgba(251,244,233,.6);border-radius:999px;padding:10px 18px;font:700 .95rem var(--f-display)}
}
@keyframes girar{0%,20%{transform:rotate(0)}55%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
/* Celular del jugador acostado: mapa grande a la izquierda, datos compactos a la derecha */
@media (orientation:landscape) and (max-height:520px){
  .tv{grid-template-columns:minmax(0,1fr) minmax(230px,34%);grid-template-rows:auto minmax(0,1fr) auto}
  .tv .tv-map{grid-column:1;grid-row:1 / span 3}
  .tv .nav,.tv.pantalla .nav{grid-column:2;grid-row:1;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px 12px}
  .tv .nav-ico,.tv.pantalla .nav-ico{width:48px;height:48px}
  .tv .nav-ico svg,.tv.pantalla .nav-ico svg{width:42px;height:42px}
  .tv .nav-dist,.tv.pantalla .nav-dist{font-size:1.7rem}
  .tv .nav-text,.tv.pantalla .nav-text{font-size:.9rem}
  .tv .nav-chip{margin-top:4px}
  .tv .side{display:flex;flex-direction:column;gap:4px;grid-column:2;grid-row:2;background:var(--surface);border-left:1px solid var(--line);padding:8px 12px;overflow:auto;min-height:0}
  .tv .side .legend,.tv .side .small,.tv .side .side-ref{display:none}
  .tv .side .side-title{font-size:.95rem;margin:0}
  .tv .side h2{font-size:1rem;margin:0}
  .tv .bar{grid-column:2;grid-row:3;border-left:1px solid var(--line);gap:6px 8px;padding:6px max(12px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) 12px}
  .tv .stat strong,.tv.pantalla .stat strong{font-size:1.1rem}
  .tv .stat span{font-size:9px}
  .tv .icon-btn{width:38px;height:38px}
  .tv .scan-btn{font-size:.95rem;padding:.6em .8em}
  .tv .bar-actions .btn{padding-top:.6em;padding-bottom:.6em}

const RAD = d => d * Math.PI / 180;
function dist(a, b) {
  const dLat = RAD(b.lat - a.lat), dLng = RAD(b.lng - a.lng);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(RAD(a.lat)) * Math.cos(RAD(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(x));

function makePlano(el, opts = {}) {

function route() {
  const hs = location.hash.slice(1);
  if (hs.startsWith('j=')) {
    try { const g = dec(hs.slice(2)); if (!g || g.v !== 1 || !Array.isArray(g.p)) throw 0; loadGame(g, false, false); }
    catch (e) { clearHash(); return showHome('El enlace del juego está incompleto. Pídanle al líder que vuelva a mostrar el QR.'); }
    clearHash(); return showTeam();
  }
  if (hs.startsWith('jugador') || hs === 'equipos') {
    const pantalla = hs !== 'equipos';
    const raw = pantalla ? hs.slice(7).replace(/^=/, '') : '';
    clearHash();
    if (raw) {
      let g = null;
      try { g = dec(raw); if (!g || g.v !== 1 || !Array.isArray(g.p)) throw 0; }
      catch (e) { return showHome('El enlace del jugador está incompleto. Vuelve a generarlo en el modo líder.'); }
      loadGame(g, true, false); return showTeam();
    }
    const fromDevice = () => {
      const g = buildGame();
      if (!g.p.some(r => BY_ID[r[0]].type === 'good')) return showHome('No encontré el recorrido. En el modo líder, toca «Guardar recorrido en la nube» después de marcar los carteles.');
      loadGame(g, pantalla, false); showTeam();
    };
    if (!Cloud.ok) return fromDevice();
    showLoading('Cargando el recorrido…');
    Cloud.loadRoute().then(g => {
      if (g && g.p.some(r => BY_ID[r[0]] && BY_ID[r[0]].type === 'good')) { loadGame(g, pantalla, false); showTeam(); }
      else fromDevice();
    }).catch(e => { console.error(e); fromDevice(); });
    return;
  }
  if (hs === 'pantalla') { clearHash(); return showScreen(); }
  if (hs.startsWith('c=')) {
    const code = hs.slice(2); clearHash();
    if (game && loadT() && !T.done) { showTeam(); setTimeout(() => handleCode(code), 350); }
    else showHome('Primero únanse al juego con el QR del líder; después escaneen los carteles.');
    return;
  }
  if (hs === 'lider') return showLeader();
  if (hs === 'control') return showControl();
  if (hs === 'carteles') return showCarteles();
  if (view === 'team' || view === 'final' || view === 'setup' || view === 'screen' || view === 'loading' || view === 'control') return;
  showHome();
}

let updateGame = () => {};
function showGame() {

    <div class="tv-map"><div id="tmap"></div>${interior ? `<div class="dpad" id="dpad" ${T.arrows === false ? 'hidden' : ''} role="group" aria-label="Flechas para mover al personaje"><button type="button" class="u" data-d="u" aria-label="Avanzar hacia el frente"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4 21 15H3z" transform="rotate(0 12 12)"/></svg></button><button type="button" class="l" data-d="l" aria-label="Izquierda"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4 21 15H3z" transform="rotate(-90 12 12)"/></svg></button><span class="mid"></span><button type="button" class="r" data-d="r" aria-label="Derecha"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4 21 15H3z" transform="rotate(90 12 12)"/></svg></button><button type="button" class="d" data-d="d" aria-label="Hacia atrás"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4 21 15H3z" transform="rotate(180 12 12)"/></svg></button></div>` : ''}<div class="pause-over" id="pauseOver" hidden><div class="card"><h2>Juego en pausa</h2><p>El líder pausó el recorrido. Enseguida seguimos.</p></div></div>${pantalla ? `<div class="live-badge">EN VIVO · ${esc(teamLabel(T)).toUpperCase()}</div>` : ''}${sim ? '<div class="sim">MODO PRUEBA · toca el plano para moverte</div>' : ''}</div>
    <aside class="side">
      <p class="side-title">El Espíritu y la misión</p><p class="side-ref">Hechos 13:1-4</p>
      <p class="kicker">${pantalla ? 'En vivo' : 'Recorrido'} · ${esc(teamLabel(T))}</p>
      <h2 id="sideNext">Buscando señal…</h2>
      ${LEGEND}

    </aside>
    <footer class="bar">
      <div class="stat"><span>Puntos</span><strong id="sScore">0</strong></div>
      <div class="stat"><span>Ruta</span><strong id="sProg">0/0</strong></div>
      <div class="stat"><span>Tiempo</span><strong id="sTime">0:00</strong></div>
      <button class="icon-btn" id="menuBtn" aria-label="Más opciones">${ICON.menu}</button>
      <div class="bar-actions"><button class="btn primary scan-btn" id="scanBtn">${ICON.scan.replace('<svg', '<svg width="22" height="22"')} Escanear cartel</button><button class="btn" id="codeBtn">Código</button></div>
    </footer>
  </div>`);

  pedirHorizontal();
  $('#keepV').onclick = () => { T.vertical = true; saveT(); $('#tvRoot').classList.remove('girar'); };
  const allPts = game.p.map(r => gp(r[0])).filter(Boolean);
  const plano = interior ? null : makePlano($('#tmap'), sim ? { onTap: (lat, lng) => Geo.setSim(lat, lng) } : {});
  if (plano) { plano.setPoints(allPts); cleanup.push(() => plano.destroy()); }
  let scene = null;
  if (interior) {
    scene = makeScene($('#tmap'), { big: pantalla });
    scene.setRoom(ROOM.w(game), ROOM.l(game));
    const lastT = T.trail[T.trail.length - 1];
    Indoor.start(game, lastT ? LL2M(lastT[0], lastT[1]) : null);
    if ($('#dpad')) cleanup.push(wireArrows($('#dpad')));
    const ivS = setInterval(() => { if (view === 'team' && Indoor.compassOn()) drawPlano(target(), Geo.pos); }, 400);
    cleanup.push(() => scene.destroy(), () => Indoor.stop(), () => clearInterval(ivS));
    window.irA = (x, y) => Indoor.moveTo(x, y);
  }
  if (sim && !interior) {
    if (!Geo.pos || !Geo.pos.sim) {
      const c = allPts.filter(p => p.lat != null);
      if (c.length) { const south = c.reduce((a, p) => p.lat < a.lat ? p : a, c[0]); Geo.setSim(south.lat - 0.00006, south.lng); }
    }
    window.irA = (lat, lng) => Geo.setSim(lat, lng);
  }
  const nearHits = {};
  function drawPlano(tgt, pos) {
    if (scene) {
      const st = { visited: new Set(Object.keys(T.visited)), seen: new Set([...Object.keys(T.warned), ...Object.keys(T.fallen), ...Object.keys(T.avoided)]), target: tgt ? tgt.id : null, warnR: WR(), arriveR: AR() };
      const { items, rings } = sceneItems(allPts, st);
      scene.render({ items, rings, trail: T.trail.map(q => LL2M(q[0], q[1])), ent: ROOM.ent(game),
        hero: { x: Indoor.x, y: Indoor.y, h: Indoor.facing(), name: pantalla ? (T.name || 'Jugador') : '' }, rotate: Indoor.compassOn() ? Indoor.facing() : null });
      return;
    }
    const st = { visited: new Set(Object.keys(T.visited)), seen: new Set([...Object.keys(T.warned), ...Object.keys(T.fallen), ...Object.keys(T.avoided)]), target: tgt ? tgt.id : null, warnR: WR(), arriveR: AR() };
    const { items, rings } = planoItems(allPts, st);
    plano.render({ items, rings, trail: T.trail, pos: pos ? { lat: pos.lat, lng: pos.lng, acc: pos.acc } : null, name: pantalla ? (T.name || 'Jugador') : '' });
  }

  let lastRot = null, lastD = null, lastTgt = null, trend = '';
  function nav(tone, icon, distTxt, text, chip, rot) {
    const n = $('#nav'); if (!n) return;
    n.dataset.tone = tone;
    const ic = $('#navIco');
    if (ic.dataset.icon !== icon) { ic.innerHTML = ICON[icon]; ic.dataset.icon = icon; lastRot = null; }
    const svg = ic.firstElementChild;
    if (svg) {
      if (rot != null) { let r = rot; if (lastRot != null) { while (r - lastRot > 180) r -= 360; while (r - lastRot < -180) r += 360; } lastRot = r; svg.style.transform = `rotate(${r}deg)`; }
      else svg.style.transform = icon === 'spin' ? '' : '';
      svg.classList.toggle('spinning', icon === 'spin');
    }
    const d = $('#navDist'); d.textContent = distTxt || ''; d.hidden = !distTxt;
    $('#navText').textContent = text;
    const c = $('#navChip'); c.textContent = chip || ''; c.hidden = !chip;
  }

  updateGame = function update() {
    if (view !== 'team' || !T) return;
    const now = Date.now(), pos = Geo.pos;
    const weak = !pos || pos.acc > WEAK_ACC || now - pos.t > 30000;
    $('#sScore').textContent = T.score;
    $('#sProg').textContent = `${Object.keys(T.visited).length}/${totalStops()}`;
    $('#sTime').textContent = fmtTime(now - T.start);

    if (pos && !weak) {
      const tr = T.trail, last = tr[tr.length - 1];
      if (!last || dist({ lat: last[0], lng: last[1] }, pos) >= (interior ? 0.6 : 1.5)) {
        tr.push([+pos.lat.toFixed(6), +pos.lng.toFixed(6)]);
        if (tr.length > 800) tr.splice(0, tr.length - 800);
        saveT();
      }
    }
    publishLive(false);
    if (ctrlPaused) { drawPlano(target(), pos && now - pos.t < 30000 ? pos : null); return nav('off', 'spin', 'Pausa', 'El líder pausó el juego', 'Esperen la señal'); }

    if (pos && !weak && !sheetOpen() && now >= T.lockUntil) {
      for (const t of traps()) {
        if (t.lat == null || T.warned[t.id] || T.fallen[t.id]) continue;
        const d = dist(pos, t);
        nearHits[t.id] = d <= WR() ? (nearHits[t.id] || 0) + 1 : 0;
        if (nearHits[t.id] >= (pos.sim ? 1 : 2)) { T.warned[t.id] = now; saveT(); openWarn(t, Math.max(1, Math.round(d))); break; }
      }
    }

    const tgt = target();
    drawPlano(tgt, pos && now - pos.t < 30000 ? pos : null);
    const sn = $('#sideNext');
    if (sn) sn.textContent = activeWarn ? 'Trampa a la vista: ¿qué le responderían?' : now < T.lockUntil ? 'Recalculando después de una trampa' : !tgt ? 'Recorrido completo' : tgt.type === 'dest' ? 'Rumbo a la capilla' : `Rumbo al punto ${goodsDone() + 1} de ${goods().length}`;
    if (activeWarn) return nav('stop', 'warn', 'Peligro', `Trampa a ${activeWarn.d} m: lean el aviso y desvíen`, 'Recalculando');
    if (now < T.lockUntil) return nav('warn', 'spin', Math.ceil((T.lockUntil - now) / 1000) + ' s', 'Recalculando… cayeron en una trampa', 'Esperen y sigan la ruta');
    if (!tgt) return nav('go', 'flag', '', 'Recorrido completo');
    const label = tgt.type === 'dest' ? 'Destino final: la capilla' : `Punto ${goodsDone() + 1} de ${goods().length}`;
    if (tgt.lat == null) return nav('off', 'qr', 'Bajo techo', `${label}${tgt.hint ? ' · ' + tgt.hint : ''}`, 'Busquen el cartel y escanéenlo');
    if (weak) {
      const denied = Geo.err === 'denied';
      return nav('off', 'nosig', denied ? 'Sin permiso' : 'Sin señal', `${label}${tgt.hint ? ' · ' + tgt.hint : ''}`, denied ? 'Activen la ubicación del navegador' : 'Sigan por la ruta y busquen el cartel');
    }
    const d = dist(pos, tgt), b = bearing(pos, tgt), h = Compass.heading;
    if (lastTgt === tgt.id && lastD != null) { if (d < lastD - 1.5) trend = 'Más cerca'; else if (d > lastD + 1.5) trend = 'Más lejos'; }
    else trend = '';
    if (lastTgt !== tgt.id || Math.abs(d - lastD) > 1.5) { lastD = d; lastTgt = tgt.id; }
    if (d <= AR()) {
      if (!T.arrived[tgt.id]) { T.arrived[tgt.id] = now; saveT(); Sound.ping(); buzz(90); }
      return nav('go', 'flag', 'Llegaron', `${label} · busquen el cartel y escanéenlo`, 'Están en la zona');
    }
    if (interior) nav('go', 'arrow', fmtDist(d), label + (tgt.hint ? ' · ' + tgt.hint : ''), trend || (Indoor.compassOn() ? 'Brújula activa' : 'Flecha según la capilla'), Indoor.compassOn() ? b - Indoor.facing() : b);
    else nav('go', 'arrow', fmtDist(d), label + (tgt.hint ? ' · ' + tgt.hint : ''), trend || (h != null ? 'Brújula activa' : 'Flecha según el plano'), h != null ? b - h : b + plano.rot());
  };

  const offGeo = Geo.on(() => updateGame());
  ctrlPaused = false;
  if (pantalla && Cloud.ok) {
    const unC = Cloud.controlRef().onSnapshot(sn => {
      if (view !== 'team' || !T) return;
      const d = sn.exists ? sn.data() : {};
      ctrlPaused = !!d.paused;
      const pv = $('#pauseOver'); if (pv) pv.hidden = !ctrlPaused;
      const c = d.cmd;
      if (c && c.at > (T.lastCmd || 0) && c.at > T.start) {
        T.lastCmd = c.at; saveT();

          if (tgt && (!c.id || c.id === tgt.id)) { closeSheet(); T.lockUntil = 0; ctrlPaused = false; handleCode(tgt.code); toast('El líder marcó la llegada'); }
        } else if (c.type === 'move') {
          // El líder tocó el plano en el control: el personaje salta a ese lugar de la capilla
          if (Indoor.on && isFinite(c.x) && isFinite(c.y)) { Indoor.moveTo(+c.x, +c.y); publishLive(true); toast('El líder corrigió tu posición'); buzz(40); }
        } else if (c.type === 'end') { closeSheet(); if (!T.done) { T.done = Date.now(); saveT(); publishLive(true); return showFinal(); } }
        else if (c.type === 'reset') { store.del(tKey()); T = null; return showTeam(); }
      }
      updateGame();
    }, () => {});
    cleanup.push(unC, () => { ctrlPaused = false; });
  }
  const iv = setInterval(() => updateGame(), 1000);
  cleanup.push(offGeo, () => clearInterval(iv), () => { updateGame = () => {}; });
  $('#scanBtn').onclick = openScanner;
  $('#codeBtn').onclick = openCode;
  $('#menuBtn').onclick = openMenu;
  if (!sim) keepAwake();
  updateGame();
}

let activeWarn = null, lastEv = null, ctrlPaused = false;
function publishLive(force) {

function handleCode(raw) {
  if (view !== 'team' || !T || T.done) return;
  const code = String(raw || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  const pr = BY_CODE[code];
  if (!pr) return sheetMsg('No reconozco ese código', 'Revisen las letras y números del cartel e inténtenlo de nuevo.');
  const p = gp(pr.id);
  if (!p) return sheetMsg('Ese cartel no está en el juego de hoy', 'Sigan buscando los puntos de su ruta.');
  if (Indoor.on && p.lat != null) { const [ix, iy] = LL2M(p.lat, p.lng); Indoor.moveTo(ix, iy); }
  if (Date.now() < T.lockUntil) return sheetMsg('Todavía están recalculando', 'Esperen a que termine la cuenta para escanear.', 'warn');
  if (ctrlPaused) return sheetMsg('Juego en pausa', 'Esperen a que el líder reanude el recorrido.', 'warn');
  if (p.type === 'trap') return fallTrap(p);
  if (T.visited[p.id]) return sheetMsg('Ya pasaron por aquí', `«${p.sign}» ya está en su ruta. Sigan al próximo destino.`);
  if (p.type === 'dest') {
    const left = goods().filter(g => !T.visited[g.id]).length;
    if (left) return sheetMsg('Todavía no es el final', `Les falta${left > 1 ? 'n' : ''} ${left} punto${left > 1 ? 's' : ''} antes de llegar a la capilla.`);
  }
  T.visited[p.id] = Date.now(); T.score += 100;
  Sound.good(); buzz([60, 40, 60]);
  lastEv = { type: p.type === 'dest' ? 'dest' : 'good', id: p.id, at: Date.now() };
  if (p.type === 'dest') { T.done = Date.now(); saveT(); publishLive(true); return showFinal(); }
  saveT(); publishLive(true);
  const n = goodsDone(), tot = goods().length;
  const w = openSheet(`<div class="sheet-head"><div class="sh-k">Punto ${n} de ${tot}</div><h2>${esc(p.title)}</h2></div>
    <div class="sheet-body"><div class="pts good">+100</div><div class="cartel-quote">«${esc(p.sign)}»</div><p>${esc(p.body)}</p><p class="ref">${esc(p.ref)}</p>
    <button class="btn primary block">${n === tot ? 'Rumbo a la capilla' : 'Siguiente destino'}</button></div>`, () => updateGame());
  w.querySelector('.btn').onclick = closeSheet;
}

function fallTrap(t) {
  if (T.fallen[t.id]) return sheetMsg('Ya cayeron en esta trampa', 'No hace falta escanearla otra vez. Sigan la ruta del GPS.');
  T.fallen[t.id] = Date.now(); T.score -= 50; T.lockUntil = Date.now() + LOCK_MS; saveT();
  lastEv = { type: 'trap', id: t.id, at: Date.now() }; publishLive(true);
  Sound.bad(); buzz([400, 120, 400]);
  const w = openSheet(`<div class="sheet-head stop"><div class="sh-k">${ICON.warn} Cayeron en una trampa</div><h2>«${esc(t.sign)}»</h2></div>
    <div class="sheet-body"><div class="pts bad">−50</div><p>${esc(t.why)}</p>
    <p class="small">El GPS está recalculando la ruta: esperen <span id="cd">15</span> segundos antes de seguir.</p>
    <button class="btn primary block">Entendido</button></div>`, () => updateGame());
  const iv = setInterval(() => { const el = w.querySelector('#cd'); if (!el) return clearInterval(iv); const s = Math.ceil((T.lockUntil - Date.now()) / 1000); if (s <= 0) { el.textContent = '0'; clearInterval(iv); } else el.textContent = s; }, 500);
  w.querySelector('.btn').onclick = closeSheet;
}

let camStream = null, camOn = false;
function stopCam() { camOn = false; if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
function extractCode(v) {
  const m = /[#?&]c=([A-Za-z0-9]{3})/.exec(v); if (m) return m[1].toUpperCase();
  const t = String(v).trim().toUpperCase(); return /^[A-Z0-9]{3}$/.test(t) ? t : null;
}
async function openScanner() {
  if (Date.now() < T.lockUntil) return sheetMsg('Todavía están recalculando', 'Esperen a que termine la cuenta para escanear.', 'warn');
  const w = openSheet(`<div class="sheet-head"><div class="sh-k">${ICON.scan} Escanear cartel</div><h2>Apunten la cámara al QR</h2></div>
    <div class="sheet-body"><div class="cam"><video id="vid" playsinline muted autoplay></video><div class="cam-frame"></div></div>
    <p class="small" id="camMsg">Antes de escanear, discutan juntos: ¿este cartel los lleva por buen camino?</p>
    <div class="row"><button class="btn" id="toCode" style="flex:1">Escribir código</button><button class="btn" id="camX" style="flex:1">Cerrar</button></div></div>`, stopCam);
  w.querySelector('#camX').onclick = closeSheet;
  w.querySelector('#toCode').onclick = () => { closeSheet(); openCode(); };
  const video = w.querySelector('#vid');
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    if (sheetEl !== w) { stopCam(); return; }
    video.srcObject = camStream; await video.play();
  } catch (e) {
    const m = w.querySelector('#camMsg'); if (m) m.innerHTML = '<b>No se pudo abrir la cámara.</b> Escriban el código del cartel o escanéenlo con la cámara del celular.';
    return;
  }
  camOn = true;
  let detector = null;
  if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {} }
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  const tick = async () => {
    if (!camOn || sheetEl !== w) return;
    let val = null;
    if (video.readyState >= 2) {
      if (detector) { try { const r = await detector.detect(video); if (r && r[0]) val = r[0].rawValue; } catch (e) { detector = null; } }
      else if (window.jsQR && video.videoWidth) {
        const sc = Math.min(1, 640 / video.videoWidth);
        canvas.width = Math.round(video.videoWidth * sc); canvas.height = Math.round(video.videoHeight * sc);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const r = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' }); if (r) val = r.data;
      }
    }
    if (val) {
      const code = extractCode(val);
      if (code) { closeSheet(); handleCode(code); return; }
      if (/#j=/.test(val)) { const m = w.querySelector('#camMsg'); if (m) m.textContent = 'Ese es el QR para unirse al juego. Escaneen el QR de un cartel.'; }
    }
    setTimeout(tick, 200);
  };
  tick();
}
function openCode() {

  const w = openSheet(`<div class="sheet-head off"><div class="sh-k">Código del cartel</div><h2>Escriban las 3 letras y números</h2></div>

function authError(e) {

}

    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const q = pt.matrixTransform(svg.getScreenCTM().inverse());
    const x = Math.round(Math.max(0.3, Math.min(w - 0.3, q.x)) * 10) / 10, y = Math.round(Math.max(0.3, Math.min(l - 0.3, q.y)) * 10) / 10;
    moving = false; sentAt = { x, y, t: Date.now() };
    send({ cmd: { type: 'move', x, y, at: Date.now() } }, 'Posición corregida');
    drawCRoom(true);
  });
  function drawCRoom(force) {
    const card = $('#cMoveCard'); if (!card) return;
    const inside = ROOM.isIn(R);
    card.hidden = !inside; if (!inside) return;
    const w = ROOM.w(R), l = ROOM.l(R), ent = ROOM.ent(R), live = D && D.run && !D.done;
    const posM = live && D.pos && D.pos.lat != null ? LL2M(D.pos.lat, D.pos.lng) : null;
    if (sentAt && Date.now() - sentAt.t > 6000) sentAt = null;
    const key = JSON.stringify([w, l, ent, R.p, live ? [D.pos, (D.visited || []).length, (D.trail || []).length, D.target] : 0, moving, sentAt]);
    if (!force && key === roomKey) return; roomKey = key;
    const visited = new Set(live ? D.visited || [] : []);
    let h = `<svg class="roomsvg" viewBox="-1 -2 ${w + 2} ${l + 4}" role="img" aria-label="Plano de la capilla con la posición del jugador">`;
    h += `<rect x="0" y="0" width="${w}" height="${l}" fill="#F3E6D2" stroke="#2536A8" stroke-width=".18"/>`;
    for (let x = 1; x < w; x++) h += `<line x1="${x}" y1="0" x2="${x}" y2="${l}" stroke="#2536A8" stroke-opacity="${x % 5 ? .08 : .22}" stroke-width=".05"/>`;
    for (let y = 1; y < l; y++) h += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="#2536A8" stroke-opacity="${y % 5 ? .08 : .22}" stroke-width=".05"/>`;
    h += `<rect x="0" y="0" width="${w}" height="1.3" fill="#EC4217" fill-opacity=".22"/><text x="${w / 2}" y="-.6" text-anchor="middle" font-size=".9" font-family="Space Mono,monospace" font-weight="700" fill="#EC4217">FRENTE</text>`;
    h += `<rect x="${ent[0] - 1}" y="${ent[1] - .4}" width="2" height=".8" rx=".2" fill="#2536A8"/><text x="${ent[0]}" y="${ent[1] + .25}" text-anchor="middle" font-size=".5" font-family="Space Mono,monospace" font-weight="700" fill="#FBF4E9">ENTRADA</text>`;
    if (live && Array.isArray(D.trail) && D.trail.length >= 4) {
      let d = ''; for (let i = 0; i + 1 < D.trail.length; i += 2) { const [x, y] = LL2M(D.trail[i], D.trail[i + 1]); d += (i ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2); }
      h += `<path d="${d}" fill="none" stroke="#2536A8" stroke-opacity=".35" stroke-width=".18" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    R.p.forEach(r => {
      const p = BY_ID[r[0]]; if (!p || r[1] == null) return;
      const [x, y] = LL2M(r[1], r[2]);
      const col = visited.has(p.id) ? '#8a8a8a' : p.type === 'trap' ? '#E5320B' : p.type === 'dest' ? '#EC4217' : '#2536A8';
      const ring = live && D.target === p.id ? `<circle cx="${x}" cy="${y}" r="1.2" fill="none" stroke="#EC4217" stroke-width=".15" stroke-dasharray=".4 .3"/>` : '';
      h += `${ring}<circle cx="${x}" cy="${y}" r=".75" fill="${col}" stroke="#fff" stroke-width=".12"/><g transform="translate(${x - .5} ${y - .5}) scale(${1 / 24})" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="${GLYPHS[iconOf(p)].d}"/></g>
        <text x="${x}" y="${y - 1}" text-anchor="middle" font-size=".6" font-family="Space Mono,monospace" font-weight="700" fill="${col}">${p.code}</text>`;
    });
    if (sentAt) h += `<circle cx="${sentAt.x}" cy="${sentAt.y}" r=".9" fill="none" stroke="#EC4217" stroke-width=".2" stroke-dasharray=".3 .25"/>`;
    if (posM) {
      const [px, py] = [Math.max(0, Math.min(w, posM[0])), Math.max(0, Math.min(l, posM[1]))];
      h += `<circle cx="${px}" cy="${py}" r=".7" fill="#FFC93C" stroke="#16225b" stroke-width=".2"/><text x="${px}" y="${py + 1.6}" text-anchor="middle" font-size=".6" font-family="Space Mono,monospace" font-weight="700" fill="#16225b">JUGADOR</text>`;
    }
    h += '</svg>';
    $('#cRoom').innerHTML = h;
    $('#cRoom').classList.toggle('placing', moving);
    $('#cMove').textContent = moving ? 'Cancelar' : 'Corregir posición';
    $('#cMoveHint').innerHTML = !live ? 'Cuando el jugador empiece el recorrido, su posición aparece aquí (punto amarillo).'
      : moving ? '<b>Toca el plano</b> donde está parado el jugador ahora.'
      : 'Si el personaje no está donde está el jugador de verdad, toca «Corregir posición» y después toca el plano.';
  }
  function render() {
    if (view !== 'control') return;
    drawCRoom();
    const now = Date.now();
    $('#cPause').textContent = ctrl.paused ? 'Reanudar el juego' : 'Pausar el juego';
    $('#cHide').textContent = ctrl.hideQ ? 'Mostrar la pregunta en el proyector' : 'Ocultar la pregunta en el proyector';
    const goodsN = R ? R.p.filter(r => BY_ID[r[0]] && BY_ID[r[0]].type === 'good').length : 0, total = goodsN + (R && R.p.some(r => BY_ID[r[0]] && BY_ID[r[0]].type === 'dest') ? 1 : 0);
    if (!D || !D.run) { $('#cWho').textContent = 'Esperando al jugador…'; $('#cNext').textContent = ''; $('#cSig').textContent = ''; $('#cScore').textContent = '0'; $('#cProg').textContent = `0/${total}`; $('#cTime').textContent = '0:00'; return; }
    $('#cWho').textContent = D.name || 'Jugador';
    $('#cScore').textContent = D.score; $('#cProg').textContent = `${(D.visited || []).length}/${total}`; $('#cTime').textContent = fmtTime((D.done || now) - D.start);
    const t = D.target ? BY_ID[D.target] : null;
    $('#cNext').textContent = D.done ? 'Llegó a la capilla.' : D.warn ? `Trampa a la vista: «${BY_ID[D.warn.id] ? BY_ID[D.warn.id].sign : ''}»` : now < (D.lockUntil || 0) ? 'Recalculando después de una trampa.' : t ? `Va hacia: «${t.sign}» (${t.code})` : '';
    const age = Math.round((now - D.t) / 1000);
    $('#cSig').textContent = D.done ? '' : `Última señal del celular: hace ${age} s${D.weak ? ' · GPS débil' : ''}${D.pos ? ` · precisión ±${D.pos.acc} m` : ''}`;
  }
  const u1 = Cloud.routeRef().onSnapshot(s => { R = s.exists ? Cloud.fromCloud(s.data()) : null; if (R) rebuildCartels(R.c || {}); render(); }, () => {});
  const u2 = Cloud.liveRef().onSnapshot(s => { D = s.exists ? s.data() : null; render(); }, () => {});
  const u3 = Cloud.controlRef().onSnapshot(s => { ctrl = s.exists ? s.data() : {}; render(); }, () => {});
  const iv = setInterval(render, 1000);
  cleanup.push(u1, u2, u3, () => clearInterval(iv));
  render();
}

/* ---------- Pantalla grande (espectador, en la computadora del proyector) ---------- */
function showScreen() {
  Geo.stop();
  if (!Cloud.ok) {
    return setView('screen', `<main class="page">
      ${poster('Pantalla grande · Falta conectar la nube')}
      <p class="lead">Mientras tanto, conecta el celular del jugador al proyector, o usa la <a href="../">presentación «El GPS y la señal perdida»</a> como plan B.</p></main>`);
  }
  setView('screen', `<div class="tv screen">
    <header class="nav" id="nav" data-tone="off" aria-live="polite">
      <div class="nav-ico" id="navIco">${ICON.spin.replace('<svg', '<svg class="spinning"')}</div>
      <div style="min-width:0"><div class="nav-dist" id="navDist" hidden></div><div class="nav-text" id="navText">Esperando al jugador…</div><span class="nav-chip" id="navChip" hidden></span></div>
    </header>
    <div class="tv-map"><div id="tmap"></div><div class="live-badge" id="liveBadge">EN VIVO</div>
      <div class="scr-wait" id="scrWait"><div class="card"><h2 id="scrWaitT">Esperando al jugador</h2><p id="scrWaitP">Cuando toque «Empezar recorrido» en su celular, su camino aparece aquí en vivo.</p></div></div></div>
    <aside class="side">
      <p class="side-title">El Espíritu y la misión</p><p class="side-ref">Hechos 13:1-4</p>
      <p class="kicker" id="scrWho">Ruta a la capilla</p>
      <h2 id="sideNext">Esperando al jugador…</h2>
      <div class="stats3 mini"><div><strong id="sScore">0</strong><span>puntos</span></div><div><strong id="sProg">0/0</strong><span>ruta</span></div><div><strong id="sTime">0:00</strong><span>tiempo</span></div></div>
      ${LEGEND}
      <div class="row"><button class="btn small" id="sndBtn">Activar sonido y voz</button><button class="btn small" id="voiceBtn" hidden>Silenciar voz</button></div>
      <p class="small" id="scrStale"></p>
    </aside>
    <div class="scr-over" id="scrOver" hidden></div>
  </div>`);

  let R = null, D = null;
  const plano = makePlano($('#tmap'));
  const scene = makeScene($('#tmap'), { big: true });
  scene.node.style.display = 'none';
  cleanup.push(() => plano.destroy(), () => scene.destroy());
  let overKey = '', lastWarnId = '', lastEvAt = 0, evUntil = 0, evHTML = '', lastRot = null, ctrl = {}, spokenAns = '';
  const P = id => { if (!R) return null; const r = R.p.find(x => x[0] === id); return r && BY_ID[id] ? { ...BY_ID[id], lat: r[1], lng: r[2], hint: r[3] || '' } : null; };
  const goodsR = () => R ? R.p.filter(r => BY_ID[r[0]] && BY_ID[r[0]].type === 'good').map(r => r[0]) : [];
  const hasDest = () => !!(R && R.p.some(r => BY_ID[r[0]] && BY_ID[r[0]].type === 'dest'));


  function nav(tone, icon, distTxt, text, chip, rot) {
    const n = $('#nav'); if (!n) return;
    n.dataset.tone = tone;
    const ic = $('#navIco');
    if (ic.dataset.icon !== icon) { ic.innerHTML = ICON[icon]; ic.dataset.icon = icon; lastRot = null; }
    const svg = ic.firstElementChild;
    if (svg) {
      svg.classList.toggle('spinning', icon === 'spin');
      if (rot != null) { let r = rot; if (lastRot != null) { while (r - lastRot > 180) r -= 360; while (r - lastRot < -180) r += 360; } lastRot = r; svg.style.transform = `rotate(${r}deg)`; }
      else svg.style.transform = '';
    }
    const d = $('#navDist'); d.textContent = distTxt || ''; d.hidden = !distTxt;
    $('#navText').textContent = text;
    const c = $('#navChip'); c.textContent = chip || ''; c.hidden = !chip;
  }
  function drawPlano(tgtId, tr, pos) {
    if (R && ROOM.isIn(R)) {
      plano.node.style.display = 'none'; scene.node.style.display = '';
      scene.setRoom(ROOM.w(R), ROOM.l(R));
      const pts = R.p.map(r => P(r[0])).filter(Boolean);
      const st = { visited: new Set(D ? D.visited || [] : []), seen: new Set(D ? [...(D.warned || []), ...(D.fallen || []), ...(D.avoided || [])] : []), target: tgtId,
        warnR: (R.r && +R.r[0]) || WARN_R, arriveR: (R.r && +R.r[1]) || ARRIVE_R };
      const { items, rings } = sceneItems(pts, st);
      const hero = pos ? (() => { const [x, y] = LL2M(pos.lat, pos.lng); return { x, y, h: pos.h || 0, name: D && D.run ? (D.name || 'Jugador') : '' }; })() : null;
      scene.render({ items, rings, trail: (tr || []).map(q => LL2M(q[0], q[1])), ent: ROOM.ent(R), hero, rotate: null });
      return;
    }
    plano.node.style.display = ''; scene.node.style.display = 'none';
    if (!R) { plano.render({ items: [], rings: [], trail: [], pos: null }); return; }
    const pts = R.p.map(r => P(r[0])).filter(Boolean);
    const st = { visited: new Set(D ? D.visited || [] : []), seen: new Set(D ? [...(D.warned || []), ...(D.fallen || []), ...(D.avoided || [])] : []), target: tgtId,
      warnR: (R.r && +R.r[0]) || WARN_R, arriveR: (R.r && +R.r[1]) || ARRIVE_R };
    const { items, rings } = planoItems(pts, st);
    plano.render({ items, rings, trail: tr, pos, name: D && D.run ? (D.name || 'Jugador') : '' });
  }
  function overlay(key, html) {
    const o = $('#scrOver'); if (!o) return;
    if (!html) { o.hidden = true; overKey = ''; return; }
    if (overKey === key) return;
    overKey = key; o.innerHTML = `<div class="sheet big">${html}</div>`; o.hidden = false;
  }
  function warnHTML(w, hide) {
    const t = BY_ID[w.id]; if (!t) return '';
    const answered = w.ans === true || w.ans === false;
    if (hide && !answered) return `<div class="sheet-head stop"><div class="sh-k">${ICON.warn} Recalculando</div><h2>Reporte de peligro a ${w.d} m</h2></div>
      <div class="sheet-body"><div class="cartel-quote">«${esc(t.sign)}»</div><p class="class-q">Lean el cartel juntos. ¿Es un buen camino?</p></div>`;
    return `<div class="sheet-head stop"><div class="sh-k">${ICON.warn} Recalculando</div><h2>Reporte de peligro a ${w.d} m</h2></div>
      <div class="sheet-body"><div class="cartel-quote">«${esc(t.sign)}»</div><p><b>${esc(t.q)}</b></p>
      ${answered ? '' : '<p class="class-q">Clase: ¿qué le responderían? Díganlo en voz alta antes de que elija.</p>'}
      <div class="opts">${t.options.map((o, i) => `<div class="opt ${answered && i === t.ok ? 'ok' : ''}">${esc(o)}</div>`).join('')}</div>
      ${answered ? (w.ans ? '<div class="pts good">+50 · ¡Desvío a tiempo!</div>' : '<p><b>Esa no era.</b> La respuesta correcta está en verde.</p>') + `<p>${esc(t.why)}</p>` : ''}</div>`;
  }
  function evHTMLFor(ev) {
    const p = BY_ID[ev.id]; if (!p) return '';
    if (ev.type === 'trap') return `<div class="sheet-head stop"><div class="sh-k">${ICON.warn} Cayó en una trampa</div><h2>«${esc(p.sign)}»</h2></div><div class="sheet-body"><div class="pts bad">−50</div><p>${esc(p.why)}</p><p class="small">Recalculando: 15 segundos de espera.</p></div>`;
    return `<div class="sheet-head"><div class="sh-k">Punto alcanzado</div><h2>${esc(p.title)}</h2></div><div class="sheet-body"><div class="pts good">+100</div><div class="cartel-quote">«${esc(p.sign)}»</div><p>${esc(p.body)}</p><p class="ref">${esc(p.ref)}</p></div>`;
  }
  function finalHTML() {
    const ok = (D.avoided || []).length, fell = (D.fallen || []).length;
    return `<div class="sheet-head"><div class="sh-k">${ICON.flag} Llegó a la capilla · ${esc(D.name || 'Jugador')}</div><h2>${D.score} puntos · ${fmtTime(D.done - D.start)}</h2></div>
      <div class="sheet-body"><div class="stats3"><div><strong>${(D.visited || []).filter(id => BY_ID[id] && BY_ID[id].type === 'good').length}</strong><span>puntos que guían</span></div><div><strong>${ok}</strong><span>trampas detectadas</span></div><div><strong>${fell}</strong><span>trampas en las que cayó</span></div></div>
      <div class="card"><p class="kicker">Frase del punto 1</p><h2>El Espíritu guía a sus hijos y les enseña a discernir juntos.</h2></div>${PUNTO2}</div>`;
  }

  function render() {
    if (view !== 'screen') return;
    const now = Date.now();
    const stale = !!(D && D.run && !D.done && now - D.t > 30 * 60000) || !!(D && D.done && now - D.done > 30 * 60000) || !!(D && D.start && now - D.start > 3 * 3600000);
    const waiting = !D || !D.run || stale;
    $('#scrWait').hidden = !waiting && !!R;
    if (!R) { $('#scrWaitT').textContent = 'Todavía no hay un recorrido guardado'; $('#scrWaitP').textContent = 'En el modo líder, entra con Google y coloca los carteles: aparecen aquí solos, con su imagen.'; }
    else { $('#scrWaitT').textContent = 'Esperando al jugador'; $('#scrWaitP').textContent = 'Cuando toque «Empezar recorrido» en su celular, su camino aparece aquí en vivo.'; }
    $('#liveBadge').hidden = waiting;
    if (waiting) {
      nav('off', 'spin', '', 'Esperando al jugador…', 'Ruta a la capilla');
      $('#sideNext').textContent = 'Esperando al jugador…'; $('#scrWho').textContent = 'Ruta a la capilla';
      $('#sScore').textContent = '0'; $('#sTime').textContent = '0:00'; $('#sProg').textContent = `0/${goodsR().length + (hasDest() ? 1 : 0)}`;
      drawPlano(null, [], null); overlay('', ''); $('#scrStale').textContent = '';
      return;
    }
    $('#scrWho').textContent = 'En vivo · ' + (D.name || 'Jugador');
    $('#liveBadge').textContent = 'EN VIVO · ' + (D.name || 'Jugador').toUpperCase();
    $('#sScore').textContent = D.score;
    $('#sProg').textContent = `${(D.visited || []).length}/${goodsR().length + (hasDest() ? 1 : 0)}`;
    $('#sTime').textContent = fmtTime((D.done || now) - D.start);
    const age = Math.round((now - D.t) / 1000);
    $('#scrStale').textContent = !D.done && age > 15 ? `Última señal del celular del jugador hace ${age} s.` : '';

    const tr = []; const f = D.trail || []; for (let i = 0; i + 1 < f.length; i += 2) tr.push([f[i], f[i + 1]]);
    const tgt = D.target ? P(D.target) : null;
    drawPlano(tgt ? tgt.id : null, tr, D.pos && !D.weak ? D.pos : (D.pos || null));

    const vg = (D.visited || []).filter(id => BY_ID[id] && BY_ID[id].type === 'good').length;
    const label = tgt ? (tgt.type === 'dest' ? 'Destino final: la capilla' : `Punto ${vg + 1} de ${goodsR().length}`) : '';
    $('#sideNext').textContent = D.done ? 'Llegó a la capilla' : D.warn ? 'Trampa a la vista: ¿qué le responderían?' : now < D.lockUntil ? 'Recalculando después de una trampa' : tgt ? (tgt.type === 'dest' ? 'Rumbo a la capilla' : `Rumbo al punto ${vg + 1} de ${goodsR().length}`) : '';
    if (D.done) nav('go', 'flag', 'Llegó', 'Recorrido completo', null);
    else if (D.warn) nav('stop', 'warn', 'Peligro', `Trampa a ${D.warn.d} m`, 'Recalculando');
    else if (now < D.lockUntil) nav('warn', 'spin', Math.ceil((D.lockUntil - now) / 1000) + ' s', 'Recalculando… cayó en una trampa', null);
    else if (!tgt) nav('go', 'flag', '', 'Recorrido completo', null);
    else if (tgt.lat == null) nav('off', 'qr', 'Bajo techo', label + (tgt.hint ? ' · ' + tgt.hint : ''), 'Busca el cartel');
    else if (D.weak || !D.pos) nav('off', 'nosig', 'Sin señal', label, 'Sigue por la ruta marcada');
    else {
      const d = dist(D.pos, tgt);
      if (d <= ((R && R.r && +R.r[1]) || ARRIVE_R)) nav('go', 'flag', 'Llegó', label + ' · busca el cartel', 'En la zona');
      else nav('go', 'arrow', fmtDist(d), label + (tgt.hint ? ' · ' + tgt.hint : ''), R && ROOM.isIn(R) ? 'Flecha según la capilla' : 'Flecha según el plano', bearing(D.pos, tgt) + (R && ROOM.isIn(R) ? 0 : plano.rot()));
    }

    if (ctrl.paused && !D.done) {
      if (overKey !== 'pause') Voice.say('Juego en pausa.', true);
      overlay('pause', `<div class="sheet-head off"><div class="sh-k">Pausa</div><h2>Juego en pausa</h2></div><div class="sheet-body"><p>El líder pausó el recorrido. Enseguida seguimos.</p></div>`);
    } else if (D.warn) {
      const t = BY_ID[D.warn.id];
      if (D.warn.id !== lastWarnId) { lastWarnId = D.warn.id; Sound.warn(); if (t) Voice.say(`Recalculando. Reporte de peligro. El cartel dice: ${t.sign}. ${ctrl.hideQ ? '¿Es un buen camino?' : t.q}`, true); }
      const ansKey = D.warn.id + String(D.warn.ans);
      if ((D.warn.ans === true || D.warn.ans === false) && spokenAns !== ansKey && t) { spokenAns = ansKey; Voice.say((D.warn.ans ? '¡Desvío a tiempo! Más cincuenta. ' : 'Esa no era. ') + t.why, true); }
      overlay('w' + ansKey + (ctrl.hideQ ? 'h' : ''), warnHTML(D.warn, !!ctrl.hideQ));
    } else if (D.done) {
      if (overKey !== 'final' + D.run) { Sound.good(); Voice.say(`${D.name || 'El jugador'} llegó a la capilla con ${D.score} puntos. El Espíritu guía a sus hijos y les enseña a discernir juntos.`, true); }
      overlay('final' + D.run, finalHTML());
    } else {
      if (D.ev && D.ev.at > lastEvAt && D.ev.at >= D.start && now - D.ev.at < 15000) {
        lastEvAt = D.ev.at; evUntil = now + 8000; evHTML = evHTMLFor(D.ev);
        if (D.ev.type === 'trap') Sound.bad(); else Sound.good();
        const p = BY_ID[D.ev.id];
        if (p) Voice.say(D.ev.type === 'trap' ? `Cayó en una trampa. ${p.why}` : `Punto alcanzado. ${p.title}. ${p.body}`, true);
      }
      if (now < evUntil && evHTML) overlay('e' + lastEvAt, evHTML); else overlay('', '');
      if (!D.warn) lastWarnId = '';
    }
  }

  const unR = Cloud.routeRef().onSnapshot(s => {
    R = s.exists ? Cloud.fromCloud(s.data()) : null;
    if (R) { rebuildCartels(R.c || {}); plano.setPoints(R.p.map(r => P(r[0])).filter(Boolean)); }
    render();
  }, e => { console.error(e); toast('No pude leer el recorrido de la nube.'); });
  const unD = Cloud.liveRef().onSnapshot(s => { D = s.exists ? s.data() : null; render(); }, e => { console.error(e); toast('No pude conectarme a la transmisión.'); });
  const unCtl = Cloud.controlRef().onSnapshot(s => { ctrl = s.exists ? s.data() : {}; render(); }, () => {});
  cleanup.push(unCtl, () => { try { speechSynthesis.cancel(); } catch (e) {} });
  const iv = setInterval(render, 1000);
  cleanup.push(unR, unD, () => clearInterval(iv));
  $('#sndBtn').onclick = () => {
    Sound.init(); Sound.ping(); Voice.on = Voice.ok(); Voice.pick();
    Voice.say('Sonido y voz activados.', true);
    $('#sndBtn').hidden = true; $('#voiceBtn').hidden = !Voice.ok();
    toast(Voice.ok() ? 'Sonido y voz activados' : 'Sonido activado (este navegador no tiene voz)');
  };
  $('#voiceBtn').onclick = () => { Voice.on = !Voice.on; if (!Voice.on) { try { speechSynthesis.cancel(); } catch (e) {} } $('#voiceBtn').textContent = Voice.on ? 'Silenciar voz' : 'Activar voz'; };
  render();
}

route();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(() => {});
})();
